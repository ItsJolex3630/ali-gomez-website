<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae3be"/>
      <stop offset="30%" stop-color="#d49a55"/>
      <stop offset="70%" stop-color="#e8b878"/>
      <stop offset="100%" stop-color="#ab7028"/>
    </linearGradient>
    <linearGradient id="goldSheen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ab7028"/>
      <stop offset="50%" stop-color="#fae3be"/>
      <stop offset="100%" stop-color="#d49a55"/>
    </linearGradient>
  </defs>

  <!-- Premium Dark Obsidian Canvas -->
  <rect width="512" height="512" rx="112" fill="#0b0a09"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#goldG)" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Camera Viewfinder Corner Markers -->
  <g stroke="url(#goldG)" stroke-width="4.5" stroke-linecap="round" fill="none" stroke-opacity="0.95">
    <path d="M 60 112 L 60 60 L 112 60"/>
    <path d="M 452 112 L 452 60 L 400 60"/>
    <path d="M 60 400 L 60 452 L 112 452"/>
    <path d="M 452 400 L 452 452 L 400 452"/>
  </g>

  <!-- Precision Viewfinder Axis Ticks -->
  <line x1="256" y1="32" x2="256" y2="48" stroke="url(#goldG)" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="464" x2="256" y2="480" stroke="url(#goldG)" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="256" x2="48" y2="256" stroke="url(#goldG)" stroke-width="3" stroke-linecap="round"/>
  <line x1="464" y1="256" x2="480" y2="256" stroke="url(#goldG)" stroke-width="3" stroke-linecap="round"/>

  <!-- Outer Circular Lens Frame -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#goldG)" stroke-width="2.5" stroke-opacity="0.45"/>
  <circle cx="256" cy="256" r="208" fill="none" stroke="url(#goldG)" stroke-width="1.5" stroke-dasharray="3 9" stroke-opacity="0.35"/>

  <!-- Monogram Glyph Group: AG Interlocked -->
  <!-- Letter A -->
  <!-- Left diagonal stem (sleek line) -->
  <path d="M 142 368 L 226 144" stroke="url(#goldG)" stroke-width="14" stroke-linecap="round"/>
  <!-- Apex cap and right heavy stem (luxury didone contrast) -->
  <path d="M 220 144 L 246 144" stroke="url(#goldG)" stroke-width="16" stroke-linecap="round"/>
  <path d="M 238 144 L 308 368" stroke="url(#goldG)" stroke-width="24" stroke-linecap="round"/>
  <!-- Base Serifs for A -->
  <path d="M 124 368 L 164 368" stroke="url(#goldG)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 288 368 L 334 368" stroke="url(#goldG)" stroke-width="10" stroke-linecap="round"/>
  <!-- A crossbar -->
  <path d="M 174 286 L 278 286" stroke="url(#goldG)" stroke-width="9" stroke-linecap="round"/>

  <!-- Letter G (Dramatic editorial sweep) -->
  <path d="M 378 198 C 354 150, 302 134, 252 146 C 182 162, 138 228, 146 300 C 156 376, 218 416, 294 412 C 356 408, 404 368, 406 302 L 298 302"
        fill="none" stroke="url(#goldSheen)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- G Vertical Spur -->
  <path d="M 406 288 L 406 338" stroke="url(#goldG)" stroke-width="16" stroke-linecap="round"/>
  <!-- G Top Teardrop Terminal -->
  <circle cx="378" cy="198" r="11" fill="url(#goldG)"/>

  <!-- Center Focal Aperture Spark -->
  <circle cx="256" cy="256" r="6" fill="#efe9dd"/>
  <path d="M 256 242 L 256 248 M 256 264 L 256 270 M 242 256 L 248 256 M 264 256 L 270 256" stroke="#efe9dd" stroke-width="2" stroke-linecap="round"/>
</svg>
